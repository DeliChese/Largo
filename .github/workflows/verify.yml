name: Verify Largo

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25.8.0'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm run lint
      - run: npm test
      - run: npm run build
